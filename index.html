<!DOCTYPE html>
<html lang="id">
<head>

<title>Uprootwear | Marketplace Thrift Store</title>

<body class="has-nav">

<header id="topbar">

    <nav class="topnav" aria-label="Menu utama">
      <a href="#/" data-nav="home">Beranda</a>
      <a href="#/pesanan" data-nav="pesanan">Pesanan</a>

<main id="view" class="container" tabindex="-1"></main>

<nav id="bottomnav" aria-label="Menu utama">
  <a href="#/" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Beranda</span></a>

</nav>

<div id="overlay"></div>
